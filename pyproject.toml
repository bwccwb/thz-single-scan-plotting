[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "thzplot"
version = "0.1.0"
description = "Quick, consistent plots of THz spectrometer scans stored on Google Drive"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy", "pandas", "matplotlib", "astropy"]

[project.scripts]
thzplot = "thzplot.cli:main"

[tool.setuptools]
packages = ["thzplot"]
